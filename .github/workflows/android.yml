name: Android checks
on: [push, pull_request, workflow_dispatch]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          # API 37 ships as a minor-versioned platform (android-37.0); compileSdkMinor 0 needs it.
          packages: 'platform-tools platforms;android-37.0 build-tools;37.0.0'
          log-accepted-android-sdk-licenses: false
      - run: chmod +x gradlew
      - run: ./gradlew assembleDebug testDebugUnitTest lintDebug
